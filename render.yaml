services:
  - type: web
    name: couture-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: bash render-start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: couture-api.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://couture-web.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: couture
  - type: web
    name: couture-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://couture-api.onrender.com/api/v1
