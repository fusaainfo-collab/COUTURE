services:
  postgres:
    image: postgres:16
    container_name: atelier-couture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atelier_couture
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: atelier_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

